actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on SkyWatch's own API. The EarthCache
    API is request/response REST plus HTTP callback webhooks and asynchronous
    search polling. No AsyncAPI document was created because there is no
    server-push (WebSocket/SSE) transport on SkyWatch's own API to model.
