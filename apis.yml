aid: skywatch
url: https://raw.githubusercontent.com/api-evangelist/skywatch/refs/heads/main/apis.yml
name: SkyWatch
kind: company
description: SkyWatch Space Applications is an Earth observation company whose EarthCache
  platform gives developers a single API to discover, price, order, and deliver
  commercial satellite imagery and geospatial data from many providers - Pleiades,
  SPOT, PlanetScope, SkySat, Sentinel-1, Sentinel-2, TripleSat, Kompsat, and more.
  The EarthCache API (base https://api.skywatch.co/earthcache, x-api-key auth)
  exposes Archive Search over historical imagery, Pipelines that monitor an area
  of interest and deliver imagery on a schedule, interval results with analytics
  and metadata download URLs, cost estimation, reusable output configurations
  (format, bands, mosaicking), saved locations, and callback-based subscriptions
  for platform events. Imagery is billed per square kilometre with resolution-based
  minimums.
