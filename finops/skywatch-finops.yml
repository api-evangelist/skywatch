description: >-
  FinOps view of EarthCache spend. EarthCache cost is driven almost entirely by
  imagery ordered, metered per square kilometre and priced by resolution tier and
  by ordering mode (archive vs. tasking), subject to per-tier purchase minimums.
  Pipelines let teams pre-set spend controls (budget_per_km2 and max_cost) so
  recurring monitoring stays within budget. EarthCache Enterprise converts this
  into an annual license with prepaid data credits and organization-wide usage
  analytics. There is no per-request API fee; the unit of cost is area of imagery
  delivered.
notes: >-
  Per-km2 rates and minimums are drawn from SkyWatch's public pricing pages and
  are not reconciled here. The primary optimization levers are AOI size (mind the
  per-tier minimums), resolution tier, archive vs. tasking, cloud-cover and
  coverage filters, and per-pipeline budget/max_cost caps.
