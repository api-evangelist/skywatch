meters:
- name: archive_area
  description: Square kilometres of archive imagery ordered, priced per km2 by resolution tier.
  unit: km2
  aggregation: sum
  dimensions:
  - account
  - pipeline
  - resolution
- name: tasking_area
  description: Square kilometres of new (tasked) imagery captured, priced per km2 by resolution tier.
  unit: km2
  aggregation: sum
  dimensions:
  - account
  - pipeline
  - resolution
- name: interval_deliveries
  description: Imagery deliveries produced by pipeline intervals, each carrying an interval cost.
  unit: deliveries
  aggregation: sum
  dimensions:
  - account
  - pipeline
- name: prepaid_credits
  description: Data credits consumed under an EarthCache Enterprise annual license.
  unit: credits
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track km2 ordered by pipeline, resolution, and archive-vs-tasking mode; review interval costs and probability of collection before committing tasking orders.
- name: Allocation
  description: Name and tag pipelines per project/team so imagery spend maps to internal cost centers.
- name: Optimization
  description: Right-size the AOI to the per-tier purchase minimum, choose the lowest sufficient resolution, prefer archive over tasking when timeliness allows, apply cloud-cover and coverage filters, and cap spend with budget_per_km2 and max_cost.
- name: Accountability
  description: Assign an owner per pipeline and review monthly km2 spend against Enterprise credits or pay-as-you-go budget.
